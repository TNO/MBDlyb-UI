# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # Only the docs dependency group is needed; the project itself depends on a
      # local mbdlyb checkout that is not available on Read the Docs.
      - uv pip install --python "${READTHEDOCS_VIRTUALENV_PATH}" --group docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf
  - htmlzip
